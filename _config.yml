title: Roschild Rui
description: "Roschild Rui 的个人主页：文章与随想"
author: Roschild Rui
email: roschild.rui@gmail.com
github_username: RoschildRui
kaggle_username: roschildrui
avatar: /img/young_age_photo.jpg

url: "https://roschildrui.github.io"
baseurl: ""
lang: en
timezone: Asia/Shanghai

# Keep the same post URLs as the previous theme so old links still work.
permalink: pretty
future: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

collections:
  thoughts:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
