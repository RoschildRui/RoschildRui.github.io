---
layout: default
---
{% assign en = page.en %}
<article class="post">
  <header class="post-header">
    <h1>{% include t.html zh=page.title en=en.title %}</h1>
  </header>

  <div class="prose{% if en %} zh{% endif %}">
    {{ content }}
  </div>
  {% if en %}
  <div class="prose en">
    {{ en.content | markdownify }}
  </div>
  {% endif %}
</article>
